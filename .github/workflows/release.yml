name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check workspace version against tag
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk -F'"' '/^\[workspace\.package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          echo "Tag version:   ${tag_version}"
          echo "Cargo version: ${cargo_version}"
          if [ "${tag_version}" != "${cargo_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml workspace version ${cargo_version}"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: allyh
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: allyh
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: allyh.exe
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p allyh-tui --bin allyh --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.ext == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          mkdir -p dist
          tar -czf "dist/allyh-${TAG}-${TARGET}.tar.gz" -C "target/${TARGET}/release" "${BIN}"

      - name: Package Windows archive
        if: matrix.ext == 'zip'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/$env:TARGET/release/$env:BIN" -DestinationPath "dist/allyh-$env:TAG-$env:TARGET.zip" -Force

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: allyh-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum allyh-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          extra_args=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            extra_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "AllyH ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${extra_args[@]}"
